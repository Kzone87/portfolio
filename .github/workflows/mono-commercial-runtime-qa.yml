name: MONO commercial runtime QA

on:
  push:
    branches: [main]
    paths:
      - 'mono-operations/**'
      - 'scripts/mono-*.mjs'
      - 'test/mono-commercial-*.test.mjs'
      - 'scripts/mono-commercial-browser-qa.mjs'
      - 'package.json'
      - '.github/workflows/mono-commercial-runtime-qa.yml'
  pull_request:
    paths:
      - 'mono-operations/**'
      - 'scripts/mono-*.mjs'
      - 'test/mono-commercial-*.test.mjs'
      - 'scripts/mono-commercial-browser-qa.mjs'
      - 'package.json'
      - '.github/workflows/mono-commercial-runtime-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run full repository and commercial tests
        run: npm test
      - name: Build delivery package
        run: npm run build:mono-delivery
      - name: Locate hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Install browser driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Run real commercial HTTP + SQLite + Chrome workflow
        run: node scripts/mono-commercial-browser-qa.mjs
      - name: Upload commercial browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mono-commercial-browser-qa
          path: mono-commercial-live-qa-artifacts
          if-no-files-found: warn
          retention-days: 7
      - name: Upload delivery package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mono-operations-commercial-delivery
          path: dist/mono-operations-delivery
          if-no-files-found: error
          retention-days: 7
