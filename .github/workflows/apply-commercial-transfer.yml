name: Apply NEXA commercial transfer

on:
  push:
    branches:
      - upgrade/nexa-commercial-100
    paths:
      - '.commercial-transfer-v2/**'
      - '.github/workflows/apply-commercial-transfer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct repaired patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find .commercial-transfer-v2 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat > /tmp/nexa-commercial-raw.patch
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          raw = pathlib.Path('/tmp/nexa-commercial-raw.patch').read_text(encoding='utf-8')

          # Replace the incomplete secure-access.js transport segment with its already-verified Git blob.
          start_marker = 'diff --git a/nexa-service-domain/secure-access.js b/nexa-service-domain/secure-access.js'
          next_marker = 'diff --git a/nexa-tech-service/cases.html b/nexa-tech-service/cases.html'
          start = raw.find(start_marker)
          end = raw.find(next_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('secure access repair markers not found')
          url = 'https://api.github.com/repos/Kzone87/portfolio/git/blobs/bc2a7cba5852ec6f0b0c617192bee0b81869378d'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'nexa-commercial-transfer'
          })
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          secure = base64.b64decode(payload['content']).decode('utf-8')
          lines = secure.splitlines()
          secure_diff = [
              start_marker,
              'new file mode 100644',
              '--- /dev/null',
              '+++ b/nexa-service-domain/secure-access.js',
              f'@@ -0,0 +1,{len(lines)} @@'
          ]
          secure_diff.extend('+' + line for line in lines)
          repaired = raw[:start] + '\n'.join(secure_diff) + '\n' + raw[end:]

          # Repair two transport-boundary newline/prefix losses.
          repaired = repaired.replace(';+}\n+\n+async function render() {', ';\n+}\n+\n+async function render() {')
          sqlite_start = repaired.find('diff --git a/field-service-ops/server/sqlite-store.mjs b/field-service-ops/server/sqlite-store.mjs')
          sqlite_end = repaired.find('diff --git a/field-service-ops/server/store.mjs b/field-service-ops/server/store.mjs')
          if sqlite_start < 0 or sqlite_end < 0:
              raise SystemExit('sqlite repair markers not found')
          sqlite = repaired[sqlite_start:sqlite_end]
          sqlite_lines = sqlite.splitlines()
          for i, line in enumerate(sqlite_lines[:-1]):
              if line.strip() == ');' and "audit(job, 'FIELD_REPORT'" in sqlite_lines[i + 1] and not line.startswith('+'):
                  sqlite_lines[i] = '+' + line
          if sqlite_lines and sqlite_lines[-1] == '}':
              sqlite_lines[-1] = ' }'
          repaired = repaired[:sqlite_start] + '\n'.join(sqlite_lines) + '\n' + repaired[sqlite_end:]

          # The transported team-admin diff is duplicated at a missing chunk boundary.
          # Exclude that entire diff and apply the intended change from the clean base file below.
          team_start = repaired.find('diff --git a/field-service-ops/team-admin.mjs b/field-service-ops/team-admin.mjs')
          team_end = repaired.find('diff --git a/index.html b/index.html')
          if team_start < 0 or team_end < 0 or team_end <= team_start:
              raise SystemExit('team admin repair markers not found')
          repaired = repaired[:team_start] + repaired[team_end:]

          pathlib.Path('/tmp/nexa-commercial.patch').write_text(repaired, encoding='utf-8')
          PY
          if ! git apply --check /tmp/nexa-commercial.patch; then
            echo '--- PATCH FAILURE CONTEXT ---'
            git apply --check --verbose /tmp/nexa-commercial.patch || true
            exit 1
          fi
      - name: Apply verified commercial source
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/nexa-commercial.patch
          python - <<'PY'
          from pathlib import Path

          # about.html was truncated at a transport boundary; apply the intended presentation changes explicitly.
          path = Path('nexa-tech-service/about.html')
          text = path.read_text(encoding='utf-8')
          if './commercial-scope.css' not in text:
              text = text.replace('<link rel="stylesheet" href="./clarity.css">', '<link rel="stylesheet" href="./clarity.css"><link rel="stylesheet" href="./commercial-scope.css">')
          text = text.replace('<span>NEXA TECH<small>', '<span>NEXA TECH SERVICE<small>')
          if './commercial-scope.js' not in text:
              text = text.replace('<script src="./app.js"></script>', '<script src="./app.js"></script>\n<script src="./commercial-scope.js"></script>')
          path.write_text(text, encoding='utf-8')

          # Rebuild team-admin agent mapping from the clean file instead of the corrupted transported diff.
          path = Path('field-service-ops/team-admin.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace("    team: $('team-team'),\n    role:", "    team: $('team-team'),\n    agent: $('team-agent'),\n    role:")
          text = text.replace("    newTeam: $('new-user-team'),\n    newRole:", "    newTeam: $('new-user-team'),\n    newAgent: $('new-user-agent'),\n    newRole:")
          text = text.replace("const state = { items: [], selectedId: null, audits: [] };", "const state = { items: [], selectedId: null, audits: [], agents: [] };")
          text = text.replace("node('p', '', `${user.username} · ${user.team || '운영팀'}`),", "node('p', '', `${user.username} · ${user.team || '운영팀'}${user.agentId ? ` · ${state.agents.find(agent => Number(agent.id) === Number(user.agentId))?.name || `기사 #${user.agentId}`}` : ''}`),")
          marker = "  function renderDetail() {\n"
          fill = "  function fillAgentSelect(select, selectedValue = '') {\n    if (!select) return;\n    const current = String(selectedValue || '');\n    select.replaceChildren();\n    const none = document.createElement('option'); none.value = ''; none.textContent = '운영/배차 전용'; select.append(none);\n    for (const agent of state.agents.filter(item => item.active !== false)) {\n      const option = document.createElement('option'); option.value = String(agent.id); option.textContent = `${agent.name}${agent.region ? ` · ${agent.region}` : ''}`; select.append(option);\n    }\n    if ([...select.options].some(option => option.value === current)) select.value = current;\n  }\n\n"
          if 'function fillAgentSelect' not in text:
              text = text.replace(marker, fill + marker)
          text = text.replace("    if (el.team) el.team.value = user.team || '';\n    if (el.role)", "    if (el.team) el.team.value = user.team || '';\n    fillAgentSelect(el.agent, user.agentId || '');\n    if (el.role)")
          text = text.replace("const [users, audits] = await Promise.all([adapter.listUsers(), adapter.authAudits()]);\n      state.items = users.items || [];\n      state.audits = audits.items || [];", "const [users, audits, agents] = await Promise.all([adapter.listUsers(), adapter.authAudits(), adapter.listAgents ? adapter.listAgents() : Promise.resolve({ items: [] })]);\n      state.items = users.items || [];\n      state.audits = audits.items || [];\n      state.agents = agents.items || [];\n      fillAgentSelect(el.newAgent, el.newAgent?.value || '');")
          text = text.replace("        team: String(el.team?.value || '').trim(),\n        role:", "        team: String(el.team?.value || '').trim(),\n        agentId: el.agent?.value ? Number(el.agent.value) : null,\n        role:")
          text = text.replace("      team: String(el.newTeam?.value || '').trim(),\n      role:", "      team: String(el.newTeam?.value || '').trim(),\n      agentId: el.newAgent?.value ? Number(el.newAgent.value) : null,\n      role:")
          path.write_text(text, encoding='utf-8')
          PY
          rm -rf .commercial-transfer-v2
          rm -f .github/workflows/apply-commercial-transfer.yml
      - name: Verify complete repository
        run: npm test
      - name: Verify delivery build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexa-delivery
          NEXA_PUBLIC_API_ORIGIN=http://127.0.0.1:8796 \
          NEXA_OPS_API_ORIGIN=http://127.0.0.1:8792 \
          NEXA_CUSTOMER_SECURE_ORIGIN=http://127.0.0.1:8797 \
          NEXA_DELIVERY_DIR=/tmp/nexa-delivery \
          npm run build:nexa-delivery
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make NEXA commercially ready'
          git push origin HEAD:${GITHUB_REF_NAME}
