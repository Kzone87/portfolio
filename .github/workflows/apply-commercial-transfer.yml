name: Apply NEXA commercial transfer

on:
  push:
    branches:
      - upgrade/nexa-commercial-100
    paths:
      - '.commercial-transfer-v2/**'
      - '.github/workflows/apply-commercial-transfer.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct repaired patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find .commercial-transfer-v2 -type f -name 'part-*' -print0 | sort -z | xargs -0 cat > /tmp/nexa-commercial-raw.patch
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          raw = pathlib.Path('/tmp/nexa-commercial-raw.patch').read_text(encoding='utf-8')
          start_marker = 'diff --git a/nexa-service-domain/secure-access.js b/nexa-service-domain/secure-access.js'
          next_marker = 'diff --git a/nexa-tech-service/cases.html b/nexa-tech-service/cases.html'
          start = raw.find(start_marker)
          end = raw.find(next_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('commercial patch repair markers not found')
          url = 'https://api.github.com/repos/Kzone87/portfolio/git/blobs/bc2a7cba5852ec6f0b0c617192bee0b81869378d'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'nexa-commercial-transfer'
          })
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          secure = base64.b64decode(payload['content']).decode('utf-8')
          lines = secure.splitlines()
          secure_diff = [
              'diff --git a/nexa-service-domain/secure-access.js b/nexa-service-domain/secure-access.js',
              'new file mode 100644',
              '--- /dev/null',
              '+++ b/nexa-service-domain/secure-access.js',
              f'@@ -0,0 +1,{len(lines)} @@'
          ]
          secure_diff.extend('+' + line for line in lines)
          repaired = raw[:start] + '\n'.join(secure_diff) + '\n' + raw[end:]
          repaired = repaired.replace(';+}\n+\n+async function render() {', ';\n+}\n+\n+async function render() {')
          repaired = repaired.replace('\n}\ndiff --git a/field-service-ops/server/store.mjs', '\n }\ndiff --git a/field-service-ops/server/store.mjs')
          pathlib.Path('/tmp/nexa-commercial.patch').write_text(repaired, encoding='utf-8')
          PY
          if ! git apply --check /tmp/nexa-commercial.patch; then
            echo '--- PATCH CONTEXT 800-1100 ---'
            nl -ba /tmp/nexa-commercial.patch | sed -n '800,1100p'
            exit 1
          fi
      - name: Apply verified commercial source
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/nexa-commercial.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('nexa-tech-service/about.html')
          text = path.read_text(encoding='utf-8')
          if './commercial-scope.css' not in text:
              text = text.replace('<link rel="stylesheet" href="./clarity.css">', '<link rel="stylesheet" href="./clarity.css"><link rel="stylesheet" href="./commercial-scope.css">')
          text = text.replace('<span>NEXA TECH<small>', '<span>NEXA TECH SERVICE<small>')
          if './commercial-scope.js' not in text:
              text = text.replace('<script src="./app.js"></script>', '<script src="./app.js"></script>\n<script src="./commercial-scope.js"></script>')
          path.write_text(text, encoding='utf-8')
          PY
          rm -rf .commercial-transfer-v2
          rm -f .github/workflows/apply-commercial-transfer.yml
      - name: Verify complete repository
        run: npm test
      - name: Verify delivery build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nexa-delivery
          NEXA_PUBLIC_API_ORIGIN=http://127.0.0.1:8796 \
          NEXA_OPS_API_ORIGIN=http://127.0.0.1:8792 \
          NEXA_CUSTOMER_SECURE_ORIGIN=http://127.0.0.1:8797 \
          NEXA_DELIVERY_DIR=/tmp/nexa-delivery \
          npm run build:nexa-delivery
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make NEXA commercially ready'
          git push origin HEAD:${GITHUB_REF_NAME}
