name: Apply final live favicon

on:
  push:
    branches:
      - fix/nexa-live-final-100
    paths:
      - '.github/workflows/apply-live-favicon-final.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add explicit project-site favicon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          needle = '  <link rel="canonical" href="https://kzone87.github.io/portfolio/">\n'
          favicon = '  <link rel="icon" href="./favicon.svg" type="image/svg+xml">\n'
          if favicon not in text:
              if needle not in text:
                  raise SystemExit('canonical marker not found')
              text = text.replace(needle, needle + favicon, 1)
          path.write_text(text, encoding='utf-8')
          PY
          grep -F '<link rel="icon" href="./favicon.svg" type="image/svg+xml">' index.html
          rm .github/workflows/apply-live-favicon-final.yml
      - name: Commit surgical favicon fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-live-favicon-final.yml
          git commit -m 'Fix deployed portfolio favicon request'
          git push origin HEAD:${GITHUB_REF_NAME}
