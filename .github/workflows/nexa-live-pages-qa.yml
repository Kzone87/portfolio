name: NEXA live Pages QA

on:
  push:
    branches:
      - main
      - verify/nexa-live-page-qa
    paths:
      - 'index.html'
      - 'commercial-portfolio.css'
      - 'commercial-portfolio.js'
      - 'project-inquiry/**'
      - 'nexa-tech-service/**'
      - 'nexa-service-domain/**'
      - 'field-service-ops/**'
      - 'scripts/nexa-live-page-qa.mjs'
      - '.github/workflows/nexa-live-pages-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Locate hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Install browser driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Verify deployed GitHub Pages in real browser
        run: node scripts/nexa-live-page-qa.mjs
      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-live-pages-qa
          path: live-qa-artifacts
          if-no-files-found: warn
          retention-days: 7
