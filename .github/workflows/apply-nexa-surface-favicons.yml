name: Apply NEXA surface favicons

on:
  push:
    branches:
      - fix/nexa-all-surface-favicons
    paths:
      - '.github/workflows/apply-nexa-surface-favicons.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add project-local favicon to all public NEXA pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pages = [
              'nexa-tech-service/index.html',
              'nexa-tech-service/about.html',
              'nexa-tech-service/services.html',
              'nexa-tech-service/industries.html',
              'nexa-tech-service/cases.html',
              'nexa-tech-service/playbook.html',
              'nexa-tech-service/contact.html',
              'nexa-service-domain/index.html',
              'field-service-ops/index.html',
          ]
          favicon = '<link rel="icon" href="../favicon.svg" type="image/svg+xml">'
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if favicon in text:
                  continue
              title = text.find('<title')
              if title < 0:
                  raise SystemExit(f'title marker missing: {name}')
              line_start = text.rfind('\n', 0, title) + 1
              indent = text[line_start:title]
              text = text[:line_start] + indent + favicon + '\n' + text[line_start:]
              path.write_text(text, encoding='utf-8')
          PY
          for page in nexa-tech-service/index.html nexa-tech-service/about.html nexa-tech-service/services.html nexa-tech-service/industries.html nexa-tech-service/cases.html nexa-tech-service/playbook.html nexa-tech-service/contact.html nexa-service-domain/index.html field-service-ops/index.html; do
            grep -F '<link rel="icon" href="../favicon.svg" type="image/svg+xml">' "$page"
          done
          rm .github/workflows/apply-nexa-surface-favicons.yml
      - name: Commit favicon coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexa-tech-service/*.html nexa-service-domain/index.html field-service-ops/index.html .github/workflows/apply-nexa-surface-favicons.yml
          git commit -m 'Cover NEXA surfaces with project favicon'
          git push origin HEAD:${GITHUB_REF_NAME}
