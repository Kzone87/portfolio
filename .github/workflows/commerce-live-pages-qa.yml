name: Commerce live Pages QA

on:
  push:
    branches:
      - main
    paths:
      - 'commerce-ops-console/**'
      - 'customer-ui.js'
      - 'product-ui.css'
      - 'scripts/commerce-live-page-qa.mjs'
      - '.github/workflows/commerce-live-pages-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for same-SHA GitHub Pages deployment
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" > /tmp/runs.json
            state="$(node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const run = (data.workflow_runs || []).find(item => item.name === 'pages build and deployment');
          process.stdout.write(run ? `${run.status}|${run.conclusion || ''}` : 'missing|');
          NODE
            )"
            status="${state%%|*}"
            conclusion="${state#*|}"
            echo "Pages deployment: ${status} ${conclusion} (attempt ${attempt})"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for the same-SHA Pages deployment.' >&2
          exit 1
      - name: Locate hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Install browser driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Verify commerce GitHub Pages in real browser
        run: node scripts/commerce-live-page-qa.mjs
      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerce-live-pages-qa
          path: commerce-live-qa-artifacts
          if-no-files-found: warn
          retention-days: 7
