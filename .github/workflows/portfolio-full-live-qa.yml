name: Portfolio full live QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'commercial-portfolio.js'
      - 'commercial-portfolio.css'
      - 'booking-portfolio.js'
      - 'home-motion.js'
      - 'booking-crm/**'
      - 'project-inquiry/**'
      - 'mini-labs/**'
      - 'nexa-tech-service/**'
      - 'nexa-service-domain/**'
      - 'field-service-ops/**'
      - 'mono-operations/**'
      - 'commerce-ops-console/**'
      - 'document-intake-approval/**'
      - 'ai-workflow-review-desk/**'
      - 'integration-control-center/**'
      - 'scripts/booking-crm-live-qa.mjs'
      - 'scripts/portfolio-full-live-qa.mjs'
      - '.github/workflows/portfolio-full-live-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'commercial-portfolio.js'
      - 'commercial-portfolio.css'
      - 'booking-portfolio.js'
      - 'home-motion.js'
      - 'booking-crm/**'
      - 'project-inquiry/**'
      - 'mini-labs/**'
      - 'nexa-tech-service/**'
      - 'nexa-service-domain/**'
      - 'field-service-ops/**'
      - 'mono-operations/**'
      - 'commerce-ops-console/**'
      - 'document-intake-approval/**'
      - 'ai-workflow-review-desk/**'
      - 'integration-control-center/**'
      - 'scripts/booking-crm-live-qa.mjs'
      - 'scripts/portfolio-full-live-qa.mjs'
      - '.github/workflows/portfolio-full-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for same-SHA GitHub Pages deployment
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" > /tmp/runs.json
            state="$(node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/runs.json', 'utf8'));
          const run = (data.workflow_runs || []).find(item => item.name === 'pages build and deployment');
          process.stdout.write(run ? `${run.status}|${run.conclusion || ''}` : 'missing|');
          NODE
            )"
            status="${state%%|*}"
            conclusion="${state#*|}"
            echo "Pages deployment: ${status} ${conclusion} (attempt ${attempt})"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for the same-SHA Pages deployment.' >&2
          exit 1
      - name: Start PR branch static server
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo 'PORTFOLIO_BASE=http://127.0.0.1:4173' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-http.log || true
          exit 1
      - name: Locate hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Install browser driver only
        run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.55.0
      - name: Verify complete public portfolio in real Chrome
        run: node scripts/portfolio-full-live-qa.mjs
      - name: Verify Booking CRM as part of full public portfolio
        env:
          BOOKING_LIVE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:4173/booking-crm/' || 'https://kzone87.github.io/portfolio/booking-crm/' }}
          BOOKING_QA_ARTIFACT_DIR: portfolio-full-live-qa-artifacts/booking-crm
        run: node scripts/booking-crm-live-qa.mjs
      - name: Upload full live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-full-live-qa
          path: portfolio-full-live-qa-artifacts
          if-no-files-found: warn
          retention-days: 7
