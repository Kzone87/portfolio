name: Apply NEXA TECH home delivery markup

on:
  push:
    branches:
      - upgrade/nexa-tech-home-delivery-100
    paths:
      - '.github/workflows/apply-nexa-tech-home-delivery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/nexa-tech-home-delivery-100
      - name: Apply delivery-ready home markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nexa-tech-service/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '  <link rel="canonical" href="https://kzone87.github.io/portfolio/nexa-tech-service/">\n',
              '  <link rel="canonical" href="https://kzone87.github.io/portfolio/nexa-tech-service/">\n  <!-- NEXA_HOME_STRUCTURED_DATA -->\n',
              'structured-data marker'
          )
          replace_once(
              '      <a href="./about.html">회사소개</a><a href="./services.html">서비스</a><a href="./industries.html">이용 고객</a><a href="./cases.html">이용 상황</a><a href="./contact.html">상담</a>',
              '      <a href="./about.html">회사소개</a><a href="./services.html">서비스</a><a href="./industries.html">이용 고객</a><a href="./cases.html">이용 상황</a><a href="../nexa-service-domain/" data-service-status>진행 조회</a><a href="./contact.html">상담</a>',
              'static status navigation'
          )
          replace_once(
              '      <div class="hero-actions"><a class="primary-link" href="./services.html">서비스 확인하기</a><a class="secondary-link" href="./contact.html">유지보수 상담하기</a></div>',
              '      <div class="hero-actions"><a class="primary-link" href="./services.html">서비스 확인하기</a><a class="secondary-link" href="./contact.html">유지보수 상담하기</a><a class="secondary-link" href="../nexa-service-domain/" data-service-status>접수 진행 확인</a></div>',
              'static status hero action'
          )
          replace_once(
              '      <div class="console-foot"><span>현장 작업 후에는 현재 상태와 남은 일을 안내합니다.</span><b>상담 →</b></div>',
              '      <div class="console-foot"><span>현장 작업 후에는 현재 상태와 남은 일을 안내합니다.</span><a class="console-consult-link" href="./contact.html">상담하기 →</a></div>',
              'console action affordance'
          )
          replace_once(
              '  </section>\n\n  <section class="section">\n    <div class="shell">\n      <div class="section-head section-head-100" data-reveal><div><span class="korean-kicker">서비스</span>',
              '  </section>\n\n  <!-- NEXA_HOME_COMPANY_PROFILE -->\n\n  <section class="section">\n    <div class="shell">\n      <div class="section-head section-head-100" data-reveal><div><span class="korean-kicker">서비스</span>',
              'company profile marker'
          )

          commercial = '''  <section class="commercial-scope" data-commercial-scope-static>
    <div class="shell">
      <div class="section-head section-head-100"><div><span class="korean-kicker">이용·계약 기준</span><h2>서비스를 시작하기 전에<br>지원 범위와 운영 기준을 먼저 맞춥니다.</h2></div><p>장비·지역·부품·현장조건을 확인한 뒤 정기관리, 건별 현장지원 또는 설치·이전 중 실제 필요한 범위를 확정합니다.</p></div>
      <div class="scope-contract-grid">
        <article><span>01 · 지원 범위</span><h3>장비·지역·기술 확인</h3><p>장비 종류와 모델, 방문지역, 기술지원 가능 범위, 부품·제조사 정책을 확인한 뒤 지원 가능 여부를 안내합니다.</p></article>
        <article><span>02 · 일정 기준</span><h3>업무 영향과 기사 일정</h3><p>모든 요청에 같은 시간을 약속하지 않습니다. 업무 중단 정도, 대체 장비, 지역, 기사 일정과 부품 상황을 확인해 방문 일정을 합의합니다.</p></article>
        <article><span>03 · 작업 기준</span><h3>현장 확인과 완료 기준</h3><p>증상·원인·조치·정상 작동 여부를 확인하고, 현장에서 끝나지 않으면 부품·재방문·추가점검을 후속작업으로 구분합니다.</p></article>
        <article><span>04 · 이력 관리</span><h3>다음 판단에 남는 기록</h3><p>접수·방문·조치·후속 요청을 같은 흐름으로 남겨 반복 장애와 다음 점검에서 이전 기록을 다시 확인할 수 있게 합니다.</p></article>
      </div>
      <div class="engagement-compare">
        <article><strong>정기 예방관리</strong><ul><li>중요 장비와 점검 주기 협의</li><li>반복 증상·소모품·주의항목 기록</li><li>다음 점검과 후속작업 연결</li></ul></article>
        <article><strong>필요 시 현장지원</strong><ul><li>고장·장애 발생 시 건별 접수</li><li>업무 영향과 방문 가능시간 확인</li><li>현장 작업 후 결과와 남은 일 안내</li></ul></article>
        <article><strong>설치·이전 작업</strong><ul><li>반입동선·전원·네트워크 사전 확인</li><li>설치 순서와 초기 가동 범위 합의</li><li>완료 확인과 남은 작업 정리</li></ul></article>
      </div>
      <div class="commercial-boundary"><strong>계약 전 확인:</strong> 실제 응답시간·방문시간·지원지역·대상 장비·부품비·정기점검 주기 등은 고객 환경을 확인한 뒤 계약 또는 작업 범위에 명시합니다. 확인되지 않은 응답시간이나 지원범위를 임의로 약속하지 않습니다.</div>
    </div>
  </section>

'''
          replace_once(
              '  <section class="cta"><div class="shell"><div class="cta-box cta-box-100">',
              commercial + '  <section class="cta"><div class="shell"><div class="cta-box cta-box-100">',
              'static commercial scope'
          )
          replace_once(
              '<span>NEXA TECH SERVICE는 포트폴리오 시연을 위해 구성한 가상 브랜드입니다.</span>',
              '<span data-demo-disclaimer>NEXA TECH SERVICE는 포트폴리오 시연을 위해 구성한 가상 브랜드입니다.</span>',
              'demo disclaimer marker'
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-nexa-tech-home-delivery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexa-tech-service/index.html .github/workflows/apply-nexa-tech-home-delivery.yml
          git commit -m 'Make NEXA TECH home progressively deliverable'
          git push origin HEAD:upgrade/nexa-tech-home-delivery-100
