name: Patch NEXA delivery runbook

on:
  push:
    branches:
      - upgrade/nexa-tech-home-delivery-100
    paths:
      - '.github/workflows/patch-nexa-delivery-runbook.yml'

permissions:
  contents: write

jobs:
  patch-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/nexa-tech-home-delivery-100
      - name: Update build instructions
        env:
          OLD_B64: ''
          NEW_B64: ''
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('NEXA_DELIVERY_RUNBOOK.md')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit(f'expected one build section, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit runbook and remove workflow
        run: |
          rm .github/workflows/patch-nexa-delivery-runbook.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NEXA_DELIVERY_RUNBOOK.md .github/workflows/patch-nexa-delivery-runbook.yml
          git commit -m 'Document real customer identity delivery build'
          git push origin HEAD:upgrade/nexa-tech-home-delivery-100
