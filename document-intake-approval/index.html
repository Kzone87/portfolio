<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="가상 인보이스·신청서·계약서의 필수값을 확인하고 수정요청·승인·반려를 직접 처리해보는 문서 검수 데모"><title>문서 접수·검수 | Kzone87 Demo</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><div><a href="../">← 체험센터</a><strong>샘플 사무팀 · 문서 접수·검수</strong></div><label>화면 권한<select id="role"><option value="SUBMITTER">문서 작성자</option><option value="REVIEWER">검수 담당자</option><option value="ADMIN">관리자</option></select></label></header>
<main><section class="hero"><h1>접수 문서 검수</h1><p>문서를 선택해 필수값을 확인하고, 작성자 화면에서는 내용을 수정하거나 검수 요청을 보낼 수 있습니다. 검수 담당자 화면에서는 승인·수정 요청·반려를 직접 처리할 수 있습니다.</p></section>
<section class="metrics"><article><strong id="m-draft">0</strong><span>작성 중</span></article><article><strong id="m-submitted">0</strong><span>검수 대기</span></article><article><strong id="m-changes">0</strong><span>수정 요청</span></article><article><strong id="m-approved">0</strong><span>승인</span></article><article><strong id="m-rejected">0</strong><span>반려</span></article></section>
<section class="workspace"><aside class="panel"><div class="head"><h2>접수 문서</h2></div><div class="filters"><input id="search" placeholder="문서 제목·거래처·문서번호 검색"><select id="status-filter"><option value="">상태 전체</option><option value="DRAFT">작성 중</option><option value="SUBMITTED">검수 대기</option><option value="NEEDS_CHANGES">수정 요청</option><option value="APPROVED">승인</option><option value="REJECTED">반려</option><option value="ARCHIVED">보관</option></select></div><div id="doc-list" class="doc-list"></div></aside>
<section class="panel detail"><div id="empty" class="empty">왼쪽에서 문서를 선택하세요.</div><div id="detail" hidden><div class="head"><div><h2 id="doc-title"></h2><p id="doc-meta" class="muted"></p></div><span id="version"></span></div><div class="summary"><article><span>현재 상태</span><strong id="status"></strong></article><article><span>문서 종류</span><strong id="type"></strong></article><article><span>필수 항목</span><strong id="check-result"></strong></article></div>
<section class="check"><h3>필수 항목 확인</h3><div id="checklist"></div></section>
<section id="edit-section" class="editor"><h3>문서 내용</h3><div id="metadata-fields" class="metadata-fields"></div><label class="wide">원문 내용<textarea id="source" rows="6" placeholder="문서에서 읽어온 원문 내용"></textarea></label><div class="actions"><button id="save">수정 저장</button><button id="extract">원문에서 값 채우기</button><button id="submit">검수 요청</button></div></section>
<section id="review-section" class="review"><h3>검수 결과</h3><textarea id="comment" rows="3" placeholder="수정 요청 또는 반려 시 이유를 입력하세요."></textarea><div class="actions"><button data-decision="APPROVE" class="approve">승인</button><button data-decision="NEEDS_CHANGES" class="warn">수정 요청</button><button data-decision="REJECT" class="reject">반려</button></div></section><button id="archive" class="archive" type="button">보관 처리</button><p id="message" class="message"></p></div></section></section>
<section class="lower"><article class="panel"><div class="head"><h2>현재 검수 대기</h2></div><div id="review-queue"></div></article><article class="panel"><div class="head"><h2>최근 변경 이력</h2></div><div id="audit-list" class="audit-list"></div></article></section>
</main><script type="module" src="./app.js"></script></body></html>
