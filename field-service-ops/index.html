<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="가상 고객 방문 요청에 담당 기사를 배정하고 일정 충돌, 출동, 현장 작업, 완료까지 직접 처리해보는 현장 배차 데모"><title>예약·현장 배차 | Kzone87 Demo</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="topbar"><div><a href="../">← 체험센터</a><strong>샘플 출장서비스 · 예약·현장 배차</strong></div><label>화면 권한<select id="role"><option value="STAFF">배차 담당자</option><option value="ADMIN">관리자</option></select></label></header>
<main><section class="hero"><h1>오늘 방문할 현장 작업</h1><p>고객 요청을 선택해 담당 기사와 방문 시간을 배정해보세요. 일정이 겹치면 저장되지 않고, 긴급 작업은 관리자 권한에서만 예외 처리할 수 있습니다.</p></section>
<section class="metrics"><article><strong id="m-active">0</strong><span>진행 중</span></article><article><strong id="m-scheduled">0</strong><span>예약 완료</span></article><article><strong id="m-dispatched">0</strong><span>출동 중</span></article><article><strong id="m-onsite">0</strong><span>현장 작업 중</span></article><article><strong id="m-urgent">0</strong><span>긴급</span></article></section>
<section class="workspace"><aside class="panel"><div class="head"><h2>방문 요청 목록</h2></div><div class="filters"><input id="search" placeholder="고객명·주소·요청내용 검색"><select id="status-filter"><option value="">상태 전체</option><option value="REQUESTED">접수됨</option><option value="SCHEDULED">예약 완료</option><option value="DISPATCHED">출동 중</option><option value="ON_SITE">현장 작업 중</option><option value="COMPLETED">완료</option><option value="CANCELLED">취소됨</option><option value="NO_SHOW">방문 불가</option></select></div><div id="job-list" class="job-list"></div></aside>
<section class="panel detail"><div id="empty" class="empty">왼쪽에서 방문 요청을 선택하세요.</div><div id="detail" hidden><div class="head"><div><h2 id="job-title"></h2><p id="job-copy" class="muted"></p></div><span id="version"></span></div><div class="state"><article><span>현재 상태</span><strong id="status"></strong></article><article><span>우선순위</span><strong id="priority"></strong></article><article><span>담당 기사</span><strong id="agent"></strong></article><article><span>방문 시간</span><strong id="slot"></strong></article></div><div id="actions" class="actions"></div>
<section class="plan"><h3>담당 기사와 방문 시간</h3><div class="form"><label>담당 기사<select id="agent-select"></select></label><label>방문 시작<input id="start-at" type="datetime-local" value="2026-09-07T10:00"></label><label>방문 종료<input id="end-at" type="datetime-local" value="2026-09-07T11:00"></label><label>긴급 예외 사유<input id="override" maxlength="200" placeholder="긴급 작업이 기존 일정과 겹칠 때만 입력"></label><button id="schedule">일정 적용</button></div><p class="fine">같은 기사의 다른 방문 일정과 시간이 겹치면 저장되지 않습니다.</p></section><p id="message" class="message"></p></div></section></section>
<section class="lower"><article class="panel"><div class="head"><h2>기사별 오늘 일정</h2></div><div id="agent-board" class="agent-board"></div></article><article class="panel"><div class="head"><h2>최근 변경 이력</h2></div><div id="audit-list" class="audit-list"></div></article></section>
</main><script type="module" src="./app.js"></script></body></html>
